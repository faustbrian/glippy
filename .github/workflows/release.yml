name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  attestations: write
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, attest, and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the recorded Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.5
          cache: false
      - name: Validate and build the release candidate
        shell: bash
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"

          task_root=$(mktemp -d "$RUNNER_TEMP/gox-release-build.XXXXXX")
          cleanup() {
            trap - EXIT HUP INT TERM
            if [ -d "$task_root/modcache" ] &&
              ! GOMODCACHE="$task_root/modcache" go clean -modcache >/dev/null 2>&1; then
              chmod -R u+w "$task_root/modcache"
            fi
            find "$task_root" -mindepth 1 -delete
            rmdir "$task_root"
          }
          trap cleanup EXIT HUP INT TERM

          GOCACHE="$task_root/cache" GOMODCACHE="$task_root/modcache" \
            GOENV=off GOWORK=off go run ./internal/releasecmd \
              --version "$GITHUB_REF_NAME" \
              --revision "$GITHUB_SHA" \
              --output "$RUNNER_TEMP/gox-release"
      - name: Attest release artifact provenance
        id: provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: ${{ runner.temp }}/gox-release/*
      - name: Publish the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/gox-release/"* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Gox $GITHUB_REF_NAME" \
            --generate-notes \
            "${release_flags[@]}"
      - name: Retain the release candidate
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gox-release-${{ github.ref_name }}
          path: ${{ runner.temp }}/gox-release
          if-no-files-found: warn
          retention-days: 14
