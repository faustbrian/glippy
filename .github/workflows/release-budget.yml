name: Release budget evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formatter-budget:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - runner: macos-15
            goos: darwin
            goarch: arm64
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
    steps:
      - name: Check out Gox
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: gox
      - name: Check out immutable formatter corpus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: faustbrian/golib
          ref: f28f85133ac6d13169745807fc39e2d5ef6bf780
          path: corpus
      - name: Install the recorded Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.5
          cache: false
      - name: Measure release budgets
        shell: bash
        env:
          GOTOOLCHAIN: local
          GOX_EDITOR_LATENCY_BUDGET_MS: "250"
          GOX_PEAK_RSS_FORMAT_BUDGET_BYTES: "2147483648"
          GOX_PEAK_RSS_FORMAT_BUDGET_SECONDS: "90"
          GOX_PEAK_RSS_FORMAT_REVISION: f28f85133ac6d13169745807fc39e2d5ef6bf780
          GOX_PEAK_RSS_FORMAT_ROOT: ${{ github.workspace }}/corpus
          GOX_PEAK_RSS_RUNS: "5"
          GOX_RELEASE_EXPECTED_GOARCH: ${{ matrix.goarch }}
          GOX_RELEASE_EXPECTED_GOOS: ${{ matrix.goos }}
          GOX_RELEASE_GOX_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/release-budget-${{ matrix.goos }}-${{ matrix.goarch }}.log"
          {
            printf 'metadata,runner_name,%s\n' "$RUNNER_NAME"
            printf 'metadata,runner_os,%s\n' "$RUNNER_OS"
            printf 'metadata,runner_arch,%s\n' "$RUNNER_ARCH"
            printf 'metadata,image_os,%s\n' "${ImageOS:-unknown}"
            printf 'metadata,image_version,%s\n' "${ImageVersion:-unknown}"
            go version
            ./benchmarks/editor-latency.sh
            ./benchmarks/peak-rss.sh
          } | tee "$evidence"
        working-directory: ${{ github.workspace }}/gox
      - name: Build and execute the release candidate
        shell: bash
        env:
          GOTOOLCHAIN: local
          GOX_RELEASE_VERSION: v0.0.0-release-candidate
        run: |
          set -euo pipefail
          task_root=$(mktemp -d "$RUNNER_TEMP/gox-release-candidate.XXXXXX")
          cleanup() {
            trap - EXIT HUP INT TERM
            if [ -d "$task_root/modcache" ] &&
              ! GOMODCACHE="$task_root/modcache" go clean -modcache >/dev/null 2>&1; then
              chmod -R u+w "$task_root/modcache"
            fi
            find "$task_root" -mindepth 1 -delete
            rmdir "$task_root"
          }
          trap cleanup EXIT HUP INT TERM

          GOCACHE="$task_root/gocache" GOMODCACHE="$task_root/modcache" \
            GOENV=off GOWORK=off go run ./internal/releasecmd \
              --version "$GOX_RELEASE_VERSION" \
              --revision "$GITHUB_SHA" \
              --output "$RUNNER_TEMP/gox-release"

          archive="$RUNNER_TEMP/gox-release/gox_${GOX_RELEASE_VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz"
          mkdir "$task_root/extracted"
          tar -xzf "$archive" -C "$task_root/extracted"
          version_output=$("$task_root/extracted/gox" version)
          test "$version_output" = "gox $GOX_RELEASE_VERSION"
        working-directory: ${{ github.workspace }}/gox
      - name: Retain raw evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-budget-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ${{ runner.temp }}/release-budget-${{ matrix.goos }}-${{ matrix.goarch }}.log
            ${{ runner.temp }}/gox-release
          if-no-files-found: error
          retention-days: 14

  release-reproducibility:
    name: Cross-runner release reproducibility
    needs: formatter-budget
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download candidate artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-budget-*
          path: ${{ runner.temp }}/release-candidates
      - name: Compare every candidate byte-for-byte
        shell: bash
        env:
          GOX_RELEASE_VERSION: v0.0.0-release-candidate
        run: |
          set -euo pipefail
          candidates="$RUNNER_TEMP/release-candidates"
          mapfile -t releases < <(
            find "$candidates" -mindepth 2 -maxdepth 2 \
              -type d -name gox-release -print | sort
          )
          test "${#releases[@]}" -eq 4
          reference=${releases[0]}
          for release in "${releases[@]}"; do
            manifest="$release/gox_${GOX_RELEASE_VERSION}_manifest.json"
            checksums="$release/gox_${GOX_RELEASE_VERSION}_checksums.txt"
            jq -e \
              --arg revision "$GITHUB_SHA" \
              --arg version "$GOX_RELEASE_VERSION" \
              '.source_revision == $revision and .version == $version and (.artifacts | length) == 4' \
              "$manifest"
            (
              cd "$release"
              sha256sum -c "$(basename "$checksums")"
            )
            diff -r --no-dereference "$reference" "$release"
          done
