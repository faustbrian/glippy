name: Release budget evidence

on:
  workflow_dispatch:
    inputs:
      diagnostic_comparison_revision:
        description: Historical Glippy revision for an exact typed-output diff
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  formatter-budget:
    if: inputs.diagnostic_comparison_revision == ''
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - runner: macos-15
            goos: darwin
            goarch: arm64
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
    steps:
      - name: Check out Glippy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: glippy
      - name: Check out immutable formatter corpus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: faustbrian/golib
          ref: f28f85133ac6d13169745807fc39e2d5ef6bf780
          path: corpus
      - name: Check out immutable typed corpus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: sqlc-dev/sqlc
          ref: 8a7cddfbb9088666eb981645285d7699e71dcb54
          path: typed-corpus
      - name: Install the recorded Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.0
          cache: false
      - name: Prove native write and fix contracts
        timeout-minutes: 5
        shell: bash
        env:
          GOFLAGS: ""
          GOTOOLCHAIN: local
          GOWORK: off
        run: |
          set -euo pipefail
          task_root=$(mktemp -d "$RUNNER_TEMP/glippy-write-fix.XXXXXX")
          cleanup() {
            trap - EXIT HUP INT TERM
            if [ -d "$task_root/modcache" ] &&
              ! GOMODCACHE="$task_root/modcache" go clean -modcache >/dev/null 2>&1; then
              chmod -R u+w "$task_root/modcache"
            fi
            find "$task_root" -mindepth 1 -delete
            rmdir "$task_root"
          }
          trap cleanup EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM

          export GOCACHE="$task_root/gocache"
          export GOMODCACHE="$task_root/modcache"
          export GOENV=off
          go test ./internal/filesystem ./internal/fix -count=1 -timeout=2m
          go test ./internal/cli \
            -run='^(TestRunWriteFormatsFileAndPreservesPermissions|TestRunFormatWriteCannotEscapeRootThroughParentSymlinkRace|TestRunLintAppliesRedundantNilCheckSafeFixIdempotently|TestRunLintFixRefusesPathThroughSymlinkedDirectory)$' \
            -count=1 \
            -timeout=2m
        working-directory: ${{ github.workspace }}/glippy
      - name: Measure release budgets
        shell: bash
        env:
          GOTOOLCHAIN: local
          GLIPPY_EDITOR_LATENCY_BUDGET_MS: "250"
          GLIPPY_PEAK_RSS_FORMAT_BUDGET_BYTES: "2147483648"
          GLIPPY_PEAK_RSS_FORMAT_BUDGET_SECONDS: ${{ matrix.goos == 'darwin' && matrix.goarch == 'amd64' && '180' || '120' }}
          GLIPPY_PEAK_RSS_FORMAT_REVISION: f28f85133ac6d13169745807fc39e2d5ef6bf780
          GLIPPY_PEAK_RSS_FORMAT_ROOT: ${{ github.workspace }}/corpus
          GLIPPY_PEAK_RSS_RUNS: "5"
          GLIPPY_PEAK_RSS_TYPED_BUDGET_BYTES: "3221225472"
          GLIPPY_PEAK_RSS_TYPED_BUDGET_SECONDS: "240"
          GLIPPY_PEAK_RSS_TYPED_OUTPUT_SHA256: ${{ matrix.goos == 'darwin' && matrix.goarch == 'arm64' && '77f989f585934478c95acff13a0671521696ad036b9430f033968bcd203baba7' || '' }}
          GLIPPY_PEAK_RSS_TYPED_REVISION: 8a7cddfbb9088666eb981645285d7699e71dcb54
          GLIPPY_PEAK_RSS_TYPED_ROOT: ${{ github.workspace }}/typed-corpus
          GLIPPY_RELEASE_EXPECTED_GOARCH: ${{ matrix.goarch }}
          GLIPPY_RELEASE_EXPECTED_GOOS: ${{ matrix.goos }}
          GLIPPY_RELEASE_GLIPPY_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/release-budget-${{ matrix.goos }}-${{ matrix.goarch }}.log"
          {
            printf 'metadata,runner_name,%s\n' "$RUNNER_NAME"
            printf 'metadata,runner_os,%s\n' "$RUNNER_OS"
            printf 'metadata,runner_arch,%s\n' "$RUNNER_ARCH"
            printf 'metadata,image_os,%s\n' "${ImageOS:-unknown}"
            printf 'metadata,image_version,%s\n' "${ImageVersion:-unknown}"
            go version
            ./benchmarks/editor-latency.sh
            ./benchmarks/peak-rss.sh
          } | tee "$evidence"
        working-directory: ${{ github.workspace }}/glippy
      - name: Build and execute the release candidate
        shell: bash
        env:
          GOTOOLCHAIN: local
          GLIPPY_RELEASE_VERSION: v1.0.0-rc.1
        run: |
          set -euo pipefail
          task_root=$(mktemp -d "$RUNNER_TEMP/glippy-release-candidate.XXXXXX")
          cleanup() {
            trap - EXIT HUP INT TERM
            if [ -d "$task_root/modcache" ] &&
              ! GOMODCACHE="$task_root/modcache" go clean -modcache >/dev/null 2>&1; then
              chmod -R u+w "$task_root/modcache"
            fi
            find "$task_root" -mindepth 1 -delete
            rmdir "$task_root"
          }
          trap cleanup EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM

          GOCACHE="$task_root/gocache" GOMODCACHE="$task_root/modcache" \
            GOENV=off GOWORK=off go run ./internal/releasecmd \
              --version "$GLIPPY_RELEASE_VERSION" \
              --revision "$GITHUB_SHA" \
              --output "$RUNNER_TEMP/glippy-release"

          archive="$RUNNER_TEMP/glippy-release/glippy_${GLIPPY_RELEASE_VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz"
          mkdir "$task_root/extracted"
          tar -xzf "$archive" -C "$task_root/extracted"
          binary="$task_root/extracted/glippy"
          version_output=$("$binary" version)
          test "$version_output" = "glippy $GLIPPY_RELEASE_VERSION"
          export GLIPPY_CACHE_DIR="$task_root/glippy-cache"
          export GOCACHE="$task_root/gocache"
          export GOMODCACHE="$task_root/modcache"
          export GOENV=off
          export GOFLAGS=""
          export GOWORK=off

          contracts="$RUNNER_TEMP/glippy-release-contracts"
          mkdir "$contracts"
          "$binary" --help >"$contracts/help.txt"
          {
            for command in \
              fmt lint check lsp init config rules explain version \
              completion help; do
              printf '## %s\n' "$command"
              "$binary" help "$command"
            done
          } >"$contracts/commands.txt"
          "$binary" rules >"$contracts/rules.txt"
          diff -u testdata/contracts/v1/help.txt "$contracts/help.txt"
          diff -u testdata/contracts/v1/commands.txt "$contracts/commands.txt"
          diff -u testdata/contracts/v1/rules.txt "$contracts/rules.txt"
          configuration_root=$(cd testdata/contracts/v1/config && pwd -P)
          {
            for profile in default recommended strict pedantic; do
              printf '## %s\n' "$profile"
              "$binary" config show \
                --config "$configuration_root/$profile.toml" \
                "$configuration_root" |
                sed "s|$configuration_root|<ROOT>|g"
            done
          } >"$contracts/profiles.txt"
          diff -u testdata/contracts/v1/profiles.txt "$contracts/profiles.txt"

          machine_root=$(cd testdata/contracts/v1/machine && pwd -P)
          machine_configuration="$machine_root/.glippy.toml"
          machine_alpha="$machine_root/alpha.go"
          machine_source="$machine_root/source.go"
          machine_invalid="$machine_root/invalid/source.go"
          run_machine_contract() {
            case_name=$1
            expected_exit=$2
            shift 2
            set +e
            "$binary" "$@" \
              >"$task_root/contract-stdout" \
              2>"$task_root/contract-stderr"
            contract_exit=$?
            set -e
            test "$contract_exit" -eq "$expected_exit"
            printf '## %s\nexit: %s\nstdout:\n' \
              "$case_name" "$contract_exit"
            sed "s|$machine_root|<ROOT>|g" "$task_root/contract-stdout"
            printf 'stderr:\n'
            sed "s|$machine_root|<ROOT>|g" "$task_root/contract-stderr"
          }
          {
            run_machine_contract format 0 \
              fmt --check --reporter=json \
              --config="$machine_configuration" "$machine_source"
            run_machine_contract lint 1 \
              lint --reporter=json \
              --config="$machine_configuration" \
              "$machine_source" "$machine_alpha"
            run_machine_contract check 1 \
              check --reporter=json \
              --config="$machine_configuration" \
              "$machine_source" "$machine_alpha"
            run_machine_contract explain 0 \
              explain self-assignment --json
            run_machine_contract source-error 2 \
              fmt --check --reporter=json \
              --config="$machine_configuration" "$machine_invalid"
            run_machine_contract invalid-invocation 3 unknown
            run_machine_contract conflict 4 init "$machine_root"
          } >"$contracts/machine.txt"
          diff -u testdata/contracts/v1/machine.txt "$contracts/machine.txt"
          {
            for reporter in text short github sarif; do
              run_machine_contract "$reporter" 1 \
                lint --reporter="$reporter" \
                --config="$machine_configuration" \
                "$machine_source" "$machine_alpha"
            done
          } >"$contracts/reporters.txt"
          diff -u testdata/contracts/v1/reporters.txt \
            "$contracts/reporters.txt"

          : >"$contracts/formatter.txt"
          while IFS=$'\t' read -r \
            case_name width input_path golden_path expected_digest; do
            formatted="$task_root/formatter-$case_name.go"
            "$binary" fmt \
              --config="testdata/contracts/v1/formatter/width-$width.toml" \
              <"$input_path" >"$formatted"
            diff -u "$golden_path" "$formatted"
            actual_digest=$(shasum -a 256 "$formatted" | awk '{print $1}')
            test "$actual_digest" = "$expected_digest"
            printf '%s\t%s\t%s\t%s\t%s\n' \
              "$case_name" "$width" "$input_path" "$golden_path" \
              "$actual_digest" >>"$contracts/formatter.txt"
          done <testdata/contracts/v1/formatter.txt
          diff -u testdata/contracts/v1/formatter.txt \
            "$contracts/formatter.txt"

          cp -R testdata/upgrade "$task_root/upgrade"
          (
            cd "$task_root/upgrade/gox-v0.1.0"
            configuration_output=$("$binary" config check .)
            test "$configuration_output" = \
              "configuration valid: $PWD/.gox.toml (discovered)"
            GOWORK=off "$binary" check ./...
          )
          (
            cd "$task_root/upgrade/early-glippy"
            configuration_output=$("$binary" config check .)
            test "$configuration_output" = \
              "configuration valid: $PWD/.glippy.toml (discovered)"
            GOWORK=off "$binary" check ./...
          )
          diff -r testdata/upgrade "$task_root/upgrade"
          printf '%s\n' \
            'gox-v0.1.0: unchanged' \
            'early-glippy: unchanged' \
            >"$contracts/upgrade.txt"
          (
            cd "$contracts"
            shasum -a 256 \
              commands.txt formatter.txt help.txt machine.txt profiles.txt \
              reporters.txt rules.txt upgrade.txt \
              >SHA256SUMS
          )
        working-directory: ${{ github.workspace }}/glippy
      - name: Retain normalized typed diagnostics for fingerprint review
        if: ${{ always() && matrix.goos == 'darwin' && matrix.goarch == 'arm64' }}
        shell: bash
        env:
          GOTOOLCHAIN: local
          TYPED_ROOT: ${{ github.workspace }}/typed-corpus
        run: |
          set -euo pipefail
          task_root=$(mktemp -d "$RUNNER_TEMP/glippy-typed-output.XXXXXX")
          cleanup() {
            trap - EXIT HUP INT TERM
            if [ -d "$task_root/modcache" ] &&
              ! GOMODCACHE="$task_root/modcache" go clean -modcache >/dev/null 2>&1; then
              chmod -R u+w "$task_root/modcache"
            fi
            find "$task_root" -mindepth 1 -delete
            rmdir "$task_root"
          }
          trap cleanup EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM

          export GOCACHE="$task_root/gocache"
          export GOMODCACHE="$task_root/modcache"
          export GLIPPY_CACHE_DIR="$task_root/glippy-cache"
          export GOENV=off
          env -u GOWORK GOFLAGS=-mod=readonly go -C "$TYPED_ROOT" mod download
          env -u GOWORK go build -o "$task_root/glippy" ./cmd/glippy

          set +e
          env -u GOWORK "$task_root/glippy" lint -Wsuspicious "$TYPED_ROOT/..." \
            >"$task_root/raw-output" 2>"$task_root/stderr"
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then
            sed -n '1,20p' "$task_root/stderr" >&2
            exit "$status"
          fi
          awk -v root="$TYPED_ROOT" '
            {
              remaining = $0
              normalized = ""
              while ((offset = index(remaining, root)) != 0) {
                normalized = normalized substr(remaining, 1, offset - 1) "<TYPED_ROOT>"
                remaining = substr(remaining, offset + length(root))
              }
              print normalized remaining
            }
          ' "$task_root/raw-output" \
            >"$RUNNER_TEMP/release-budget-darwin-arm64-typed-output.txt"
          shasum -a 256 \
            "$RUNNER_TEMP/release-budget-darwin-arm64-typed-output.txt"
        working-directory: ${{ github.workspace }}/glippy
      - name: Retain raw evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-budget-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ${{ runner.temp }}/release-budget-${{ matrix.goos }}-${{ matrix.goarch }}.log
            ${{ runner.temp }}/release-budget-${{ matrix.goos }}-${{ matrix.goarch }}-typed-output.txt
            ${{ runner.temp }}/glippy-release
            ${{ runner.temp }}/glippy-release-contracts
          if-no-files-found: error
          retention-days: 14

  diagnostic-comparison:
    if: inputs.diagnostic_comparison_revision != ''
    name: Exact Darwin arm64 diagnostic comparison
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out current Glippy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: glippy
      - name: Check out historical Glippy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: faustbrian/glippy
          ref: ${{ inputs.diagnostic_comparison_revision }}
          persist-credentials: false
          path: historical-glippy
      - name: Check out immutable typed corpus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: sqlc-dev/sqlc
          ref: 8a7cddfbb9088666eb981645285d7699e71dcb54
          persist-credentials: false
          path: typed-corpus
      - name: Install the recorded Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.0
          cache: false
      - name: Retain exact normalized diagnostic delta
        shell: bash
        env:
          CURRENT_ROOT: ${{ github.workspace }}/glippy
          GOTOOLCHAIN: local
          HISTORICAL_ROOT: ${{ github.workspace }}/historical-glippy
          HISTORICAL_REVISION: ${{ inputs.diagnostic_comparison_revision }}
          TYPED_ROOT: ${{ github.workspace }}/typed-corpus
        run: |
          set -euo pipefail
          task_root=$(mktemp -d "$RUNNER_TEMP/glippy-diagnostic-comparison.XXXXXX")
          cleanup() {
            trap - EXIT HUP INT TERM
            if [ -d "$task_root/modcache" ] &&
              ! GOMODCACHE="$task_root/modcache" go clean -modcache >/dev/null 2>&1; then
              chmod -R u+w "$task_root/modcache"
            fi
            find "$task_root" -mindepth 1 -delete
            rmdir "$task_root"
          }
          trap cleanup EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM

          case "$HISTORICAL_REVISION" in
            *[!0-9a-f]*)
              printf '%s\n' 'historical revision must be lowercase hexadecimal' >&2
              exit 1
              ;;
          esac
          test "${#HISTORICAL_REVISION}" -eq 40
          test "$(git -C "$CURRENT_ROOT" rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C "$HISTORICAL_ROOT" rev-parse HEAD)" = "$HISTORICAL_REVISION"
          test "$(git -C "$TYPED_ROOT" rev-parse HEAD)" = \
            8a7cddfbb9088666eb981645285d7699e71dcb54
          export GOCACHE="$task_root/gocache"
          export GOMODCACHE="$task_root/modcache"
          export GOENV=off
          env -u GOWORK GOFLAGS=-mod=readonly go -C "$CURRENT_ROOT" mod download
          env -u GOWORK GOFLAGS=-mod=readonly go -C "$HISTORICAL_ROOT" mod download
          env -u GOWORK GOFLAGS=-mod=readonly go -C "$TYPED_ROOT" mod download
          env -u GOWORK go -C "$CURRENT_ROOT" build \
            -o "$task_root/current-glippy" ./cmd/glippy
          env -u GOWORK go -C "$HISTORICAL_ROOT" build \
            -o "$task_root/historical-glippy" ./cmd/glippy

          capture() {
            label=$1
            binary=$2
            raw="$task_root/$label-raw"
            stderr="$task_root/$label-stderr"
            output="$RUNNER_TEMP/release-budget-$label-typed-output.txt"
            set +e
            env -u GOWORK GLIPPY_CACHE_DIR="$task_root/$label-glippy-cache" \
              "$binary" lint -Wsuspicious "$TYPED_ROOT/..." \
              >"$raw" 2>"$stderr"
            status=$?
            set -e
            if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then
              sed -n '1,20p' "$stderr" >&2
              exit "$status"
            fi
            awk -v root="$TYPED_ROOT" '
              {
                remaining = $0
                normalized = ""
                while ((offset = index(remaining, root)) != 0) {
                  normalized = normalized substr(remaining, 1, offset - 1) "<TYPED_ROOT>"
                  remaining = substr(remaining, offset + length(root))
                }
                print normalized remaining
              }
            ' "$raw" >"$output"
          }

          capture historical "$task_root/historical-glippy"
          capture current "$task_root/current-glippy"
          set +e
          diff -u \
            "$RUNNER_TEMP/release-budget-historical-typed-output.txt" \
            "$RUNNER_TEMP/release-budget-current-typed-output.txt" \
            >"$RUNNER_TEMP/release-budget-typed-output.diff"
          diff_status=$?
          set -e
          if [ "$diff_status" -ne 0 ] && [ "$diff_status" -ne 1 ]; then
            exit "$diff_status"
          fi
          {
            printf 'current_revision=%s\n' "$GITHUB_SHA"
            printf 'historical_revision=%s\n' "$HISTORICAL_REVISION"
            printf 'typed_revision=%s\n' \
              8a7cddfbb9088666eb981645285d7699e71dcb54
            go version
          } >"$RUNNER_TEMP/release-budget-diagnostic-comparison-metadata.txt"
          shasum -a 256 \
            "$RUNNER_TEMP/release-budget-historical-typed-output.txt" \
            "$RUNNER_TEMP/release-budget-current-typed-output.txt" \
            "$RUNNER_TEMP/release-budget-typed-output.diff" \
            "$RUNNER_TEMP/release-budget-diagnostic-comparison-metadata.txt"
      - name: Upload exact diagnostic comparison
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-budget-diagnostic-comparison
          path: |
            ${{ runner.temp }}/release-budget-historical-typed-output.txt
            ${{ runner.temp }}/release-budget-current-typed-output.txt
            ${{ runner.temp }}/release-budget-typed-output.diff
            ${{ runner.temp }}/release-budget-diagnostic-comparison-metadata.txt
          if-no-files-found: error
          retention-days: 14

  release-reproducibility:
    name: Cross-runner release reproducibility
    needs: formatter-budget
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download candidate artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-budget-*
          path: ${{ runner.temp }}/release-candidates
      - name: Compare every candidate byte-for-byte
        shell: bash
        env:
          GLIPPY_RELEASE_VERSION: v1.0.0-rc.1
        run: |
          set -euo pipefail
          candidates="$RUNNER_TEMP/release-candidates"
          mapfile -t releases < <(
            find "$candidates" -mindepth 2 -maxdepth 2 \
              -type d -name glippy-release -print | sort
          )
          test "${#releases[@]}" -eq 4
          reference=${releases[0]}
          reference_contracts=$(dirname "$reference")/glippy-release-contracts
          for release in "${releases[@]}"; do
            manifest="$release/glippy_${GLIPPY_RELEASE_VERSION}_manifest.json"
            checksums="$release/glippy_${GLIPPY_RELEASE_VERSION}_checksums.txt"
            jq -e \
              --arg revision "$GITHUB_SHA" \
              --arg version "$GLIPPY_RELEASE_VERSION" \
              '.source_revision == $revision and .version == $version and (.artifacts | length) == 4' \
              "$manifest"
            (
              cd "$release"
              sha256sum -c "$(basename "$checksums")"
            )
            diff -r --no-dereference "$reference" "$release"
            contracts=$(dirname "$release")/glippy-release-contracts
            diff -r --no-dereference "$reference_contracts" "$contracts"
          done
