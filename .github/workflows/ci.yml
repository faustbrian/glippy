name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Glippy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the recorded Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.0
          cache: false
      - name: Verify source and behavior
        shell: bash
        run: |
          set -euo pipefail
          task_root=$(mktemp -d "$RUNNER_TEMP/glippy-ci.XXXXXX")
          cleanup() {
            trap - EXIT HUP INT TERM
            if [ -d "$task_root/modcache" ] &&
              ! GOMODCACHE="$task_root/modcache" go clean -modcache >/dev/null 2>&1; then
              chmod -R u+w "$task_root/modcache"
            fi
            find "$task_root" -mindepth 1 -delete
            rmdir "$task_root"
          }
          trap cleanup EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM

          export GOCACHE="$task_root/gocache"
          export GOMODCACHE="$task_root/modcache"
          export GLIPPY_CACHE_DIR="$task_root/glippy-cache"
          export GOENV=off
          export GOTOOLCHAIN=local

          package_list="$task_root/packages.txt"
          go list ./... > "$package_list"
          mapfile -t packages < "$package_list"
          test "${#packages[@]}" -gt 0
          go test "${packages[@]}" -count=1
          go test -race -p=1 "${packages[@]}" -count=1
          go vet "${packages[@]}"
          go mod tidy -diff
          go build -o "$task_root/glippy" ./cmd/glippy
          cp -R testdata/upgrade "$task_root/upgrade"
          (
            cd "$task_root/upgrade/gox-v0.1.0"
            configuration_output=$("$task_root/glippy" config check .)
            test "$configuration_output" = \
              "configuration valid: $PWD/.gox.toml (discovered)"
            "$task_root/glippy" check ./...
          )
          (
            cd "$task_root/upgrade/early-glippy"
            configuration_output=$("$task_root/glippy" config check .)
            test "$configuration_output" = \
              "configuration valid: $PWD/.glippy.toml (discovered)"
            "$task_root/glippy" check ./...
          )
          go test -tags=glippy_runtime_probes -c \
            -o "$task_root/benchmarks.test" ./benchmarks
          go build -o "$task_root/process-group" ./benchmarks/cmd/process-group
          sh -n benchmarks/editor-latency.sh
          sh -n benchmarks/peak-rss.sh
          sh -n benchmarks/peak-latency-select.sh
          sh -n benchmarks/peak-rss-sample.sh
          sh -n benchmarks/peak-rss-select.sh
          sh -n benchmarks/process-tree-rss.sh
          "$task_root/glippy" check ./...
